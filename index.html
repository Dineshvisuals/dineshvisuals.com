<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dinesh Visuals | Video Editing & Content Creation</title>

  <meta name="description" content="Dinesh Visuals - Professional video editing, movie editing, reels, social media content, cinematic edits and creative video production.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #ffffff;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* NAVIGATION */

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8,8,8,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo span {
      color: #ff3b30;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #ff3b30;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 7% 80px;
      background:
        radial-gradient(circle at 80% 30%, #351010 0%, transparent 35%),
        radial-gradient(circle at 20% 80%, #151515 0%, transparent 40%),
        #080808;
    }

    .hero-content {
      max-width: 850px;
    }

    .small-title {
      color: #ff3b30;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(48px, 9vw, 100px);
      line-height: 0.95;
      margin-bottom: 25px;
      letter-spacing: -4px;
    }

    .hero h1 span {
      color: #ff3b30;
    }

    .hero p {
      max-width: 650px;
      color: #bcbcbc;
      font-size: 19px;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 25px;
      border-radius: 5px;
      font-weight: bold;
      display: inline-block;
      transition: 0.3s;
    }

    .btn-primary {
      background: #ff3b30;
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      background: #ff5147;
    }

    .btn-outline {
      border: 1px solid #555;
      color: white;
    }

    .btn-outline:hover {
      border-color: #ff3b30;
      color: #ff3b30;
    }

    /* GENERAL */

    section {
      padding: 100px 7%;
    }

    .section-title {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .section-title span {
      color: #ff3b30;
    }

    .section-subtitle {
      color: #999;
      max-width: 650px;
      margin-bottom: 50px;
    }

    /* SERVICES */

    .services {
      background: #0d0d0d;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .service-card {
      background: #151515;
      padding: 35px;
      border: 1px solid #242424;
      border-radius: 8px;
      transition: 0.3s;
    }

    .service-card:hover {
      transform: translateY(-8px);
      border-color: #ff3b30;
    }

    .service-number {
      color: #ff3b30;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .service-card h3 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .service-card p {
      color: #999;
      font-size: 15px;
    }

    /* ABOUT */

    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .about-text p {
      color: #aaa;
      margin-bottom: 20px;
    }

    .about-box {
      background: linear-gradient(145deg, #1a1a1a, #0e0e0e);
      padding: 50px;
      border: 1px solid #292929;
      border-radius: 10px;
    }

    .about-box h3 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    /* PORTFOLIO */

    .portfolio {
      background: #0d0d0d;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .portfolio-card {
      min-height: 240px;
      background: linear-gradient(135deg, #202020, #0d0d0d);
      border-radius: 8px;
      border: 1px solid #292929;
      display: flex;
      align-items: flex-end;
      padding: 25px;
      transition: 0.3s;
    }

    .portfolio-card:hover {
      transform: scale(1.02);
      border-color: #ff3b30;
    }

    .portfolio-card h3 {
      font-size: 20px;
    }

    .portfolio-card p {
      color: #999;
      font-size: 13px;
    }

    /* PROCESS */

    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .process-card {
      border-left: 2px solid #ff3b30;
      padding: 20px;
      background: #111;
    }

    .process-card span {
      color: #ff3b30;
      font-weight: bold;
    }

    .process-card h3 {
      margin: 10px 0;
    }

    .process-card p {
      color: #999;
      font-size: 14px;
    }

    /* CONTACT */

    .contact {
      text-align: center;
      background:
        radial-gradient(circle at center, #351010, transparent 50%),
        #080808;
    }

    .contact h2 {
      font-size: clamp(40px, 7vw, 75px);
      line-height: 1;
      margin-bottom: 20px;
    }

    .contact p {
      color: #aaa;
      margin: 0 auto 30px;
      max-width: 600px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid #222;
      padding: 30px 7%;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #777;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .nav-links {
        display: none;
      }

      .hero {
        padding-top: 150px;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .hero p {
        font-size: 16px;
      }

      section {
        padding: 75px 6%;
      }

      .service-grid,
      .portfolio-grid {
        grid-template-columns: 1fr;
      }

      .about {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .process-grid {
        grid-template-columns: 1fr 1fr;
      }

      .about-box {
        padding: 30px;
      }

      footer {
        flex-direction: column;
        text-align: center;
      }
    }

    @media (max-width: 500px) {
      .process-grid {
        grid-template-columns: 1fr;
      }

      .buttons {
        flex-direction: column;
      }

      .btn {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->

  <nav>
    <div class="logo">
      DINESH<span>VISUALS</span>
    </div>

    <div class="nav-links">
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>


  <!-- HERO -->

  <section class="hero" id="home">

    <div class="hero-content">

      <div class="small-title">
        Video Editing • Content • Visuals
      </div>

      <h1>
        WE CREATE<br>
        <span>VISUAL STORIES
