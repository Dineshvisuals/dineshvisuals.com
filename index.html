========================= */

*{

    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    line-height:1.6;
}

a{

    color:inherit;

/* =========================
   NAVIGATION
========================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 7%;

    background:rgba(0,0,0,.85);
    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(255,255,255,.08);

    z-index:1000;

    font-weight:800;
    letter-spacing:2px;

    color:#e50914;

.nav-links{
    display:flex;
    gap:30px;
}

.nav-links a{
    font-size:14px;
    color:#ccc;
    transition:.3s;
}

.nav-links a:hover{
    color:#e50914;
}


/* =========================
   HERO IMAGE
========================= */

.hero-image{
    width:100%;
    height:78vh;
    min-height:500px;

    margin-top:72px;

    overflow:hidden;

    background:#000;
}

.hero-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    /*
       Keeps the main subject visible
       and reduces the right-side area.
    */
    object-position:42% center;

    display:block;
}

}

    margin:0 auto 35px;

    font-size:18px;
}

    flex-wrap:wrap;
}

    font-weight:bold;

    transition:.3s;
}

    color:white;
